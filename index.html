<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 修图</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(180deg, #f8f9fa 0%, #e9ecef 100%);
            height: 100vh; overflow: hidden; color: #333;
        }
        .container {
            height: 100vh; display: flex; flex-direction: column;
            padding: 16px; max-width: 420px; margin: 0 auto;
        }
        .header { text-align: center; margin-bottom: 12px; }
        .header h1 { font-size: 22px; font-weight: 600; color: #1a1a1a; }
        .api-config { margin-bottom: 12px; }
        .api-config input {
            width: 100%; padding: 10px 14px; border: 1px solid #e0e0e0;
            border-radius: 10px; font-size: 13px; background: white;
            transition: all 0.2s ease;
        }
        .api-config input:focus {
            outline: none; border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }
        .api-config input::placeholder { color: #bbb; }
        .image-preview {
            flex: 1; min-height: 0; background: white; border-radius: 16px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            margin-bottom: 12px; box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            cursor: pointer; transition: all 0.3s ease; border: 2px dashed #e0e0e0;
            overflow: hidden;
        }
        .image-preview:hover {
            border-color: #6366f1; transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        .image-preview.has-image { border: none; padding: 0; }
        .image-preview img {
            width: 100%; height: 100%; object-fit: contain; border-radius: 14px;
        }
        .add-icon {
            width: 48px; height: 48px; border-radius: 50%;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 8px; box-shadow: 0 4px 16px rgba(99, 102, 241, 0.3);
        }
        .add-icon svg { width: 24px; height: 24px; color: white; }
        .preview-text { font-size: 12px; color: #888; font-weight: 500; }
        .prompt-section { margin-bottom: 12px; }
        .prompt-section textarea {
            width: 100%; height: 60px; padding: 10px 14px;
            border: 1px solid #e0e0e0; border-radius: 10px;
            font-size: 13px; resize: none; background: white;
            transition: all 0.2s ease; font-family: inherit;
        }
        .prompt-section textarea:focus {
            outline: none; border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }
        .prompt-section textarea::placeholder { color: #bbb; }
        .generate-btn {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white; border: none; border-radius: 12px;
            font-size: 15px; font-weight: 600; cursor: pointer;
            transition: all 0.3s ease; box-shadow: 0 4px 16px rgba(99, 102, 241, 0.3);
            margin-bottom: 12px;
        }
        .generate-btn:hover {
            transform: translateY(-2px); box-shadow: 0 6px 24px rgba(99, 102, 241, 0.4);
        }
        .generate-btn:active { transform: translateY(0); }
        .generate-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .result-section { flex-shrink: 0; }
        .result-section h2 { font-size: 14px; font-weight: 600; color: #1a1a1a; margin-bottom: 8px; }
        .result-preview {
            width: 100%; height: 120px; background: white; border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06); overflow: hidden;
        }
        .result-preview img { width: 100%; height: 100%; object-fit: contain; }
        .result-placeholder { text-align: center; color: #bbb; }
        .result-placeholder svg { width: 32px; height: 32px; margin-bottom: 8px; opacity: 0.5; }
        .result-placeholder p { font-size: 12px; }
        .loading { display: none; text-align: center; padding: 20px 0; }
        .loading.active { display: block; }
        .spinner {
            width: 36px; height: 36px; border: 3px solid #e0e0e0;
            border-top-color: #6366f1; border-radius: 50%;
            animation: spin 1s linear infinite; margin: 0 auto 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading p { font-size: 13px; color: #888; }
        .error-message {
            display: none; background: #fef2f2; border: 1px solid #fecaca;
            border-radius: 10px; padding: 10px 14px; margin-bottom: 12px;
        }
        .error-message.active { display: block; }
        .error-message p { font-size: 12px; color: #dc2626; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <header class="header"><h1>AI 修图</h1></header>
        <div class="api-config">
            <input type="password" id="apiKey" placeholder="输入 API Key">
        </div>
        <div class="image-preview" id="imagePreview" onclick="document.getElementById('fileInput').click()">
            <div class="add-icon">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
            </div>
            <span class="preview-text">点击选择图片</span>
        </div>
        <input type="file" id="fileInput" accept="image/*" style="display: none" onchange="handleImageUpload(event)">
        <div class="prompt-section">
            <textarea id="prompt" placeholder="描述你想要的效果..."></textarea>
        </div>
        <button class="generate-btn" id="generateBtn" onclick="generateImage()">生成</button>
        <div class="error-message" id="errorMessage"><p id="errorText"></p></div>
        <div class="loading" id="loading"><div class="spinner"></div><p>生成中...</p></div>
        <div class="result-section" id="resultSection">
            <h2>结果</h2>
            <div class="result-preview" id="resultPreview">
                <div class="result-placeholder">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                    <p>等待生成...</p>
                </div>
            </div>
        </div>
    </div>
    <script>
        let uploadedImage = null;

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedImage = e.target.result;
                    const preview = document.getElementById('imagePreview');
                    preview.innerHTML = '<img src="' + uploadedImage + '" alt="Uploaded image">';
                    preview.classList.add('has-image');
                };
                reader.readAsDataURL(file);
            }
        }

        async function generateImage() {
            const apiKey = document.getElementById('apiKey').value;
            const prompt = document.getElementById('prompt').value;
            if (!apiKey) { showError('请输入 API Key'); return; }
            if (!uploadedImage) { showError('请先上传图片'); return; }
            if (!prompt) { showError('请输入提示词'); return; }
            hideError(); showLoading();
            document.getElementById('resultSection').classList.add('hidden');
            try {
                const base64Data = uploadedImage.split(',')[1];
                const response = await fetch('https://wellai.cc/openai/v1/images/generations', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + apiKey, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: 'Nano-Banana-Pro2',
                        prompt: prompt,
                        response_format: 'b64_json',
                        advance: {
                            reference_images: {
                                normal_reference_images: [{ image: 'data:image/jpeg;base64,' + base64Data }]
                            }
                        }
                    })
                });
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error?.message || '生成失败');
                }
                const data = await response.json();
                const imageUrl = 'data:image/png;base64,' + data.data[0].b64_json;
                const resultSection = document.getElementById('resultSection');
                document.getElementById('resultPreview').innerHTML = '<img src="' + imageUrl + '" alt="Generated image">';
                resultSection.classList.remove('hidden');
            } catch (error) {
                showError(error.message || '生成失败，请稍后重试');
            } finally { hideLoading(); }
        }

        function showError(message) {
            document.getElementById('errorText').textContent = message;
            document.getElementById('errorMessage').classList.add('active');
        }
        function hideError() { document.getElementById('errorMessage').classList.remove('active'); }
        function showLoading() { document.getElementById('loading').classList.add('active'); }
        function hideLoading() { document.getElementById('loading').classList.remove('active'); }
    </script>
</body>
</html>
