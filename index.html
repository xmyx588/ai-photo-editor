<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ffffff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="AI修图">
    <title>AI 修图</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(180deg, #f8f9fa 0%, #e9ecef 100%);
            height: 100vh; overflow: hidden; color: #333;
        }
        .container {
            height: 100vh; display: flex; flex-direction: column;
            padding: 16px; max-width: 420px; margin: 0 auto;
        }
        .header { text-align: center; margin-bottom: 12px; position: relative; }
        .header h1 { font-size: 22px; font-weight: 600; color: #1a1a1a; }
        .version-tag { font-size: 10px; color: #9ca3af; margin-top: 4px; }
        .settings-btn {
            position: absolute; right: 0; top: 50%; transform: translateY(-50%);
            width: 36px; height: 36px; border-radius: 50%;
            background: white; border: 1px solid #e0e0e0;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .settings-btn:hover { border-color: #6366f1; box-shadow: 0 2px 12px rgba(99,102,241,0.15); }
        .settings-btn svg { width: 18px; height: 18px; color: #666; }
        .preview-wrapper {
            flex: 1; min-height: 0; position: relative;
            margin-bottom: 12px;
            display: flex; align-items: center; justify-content: center;
        }
        .image-preview {
            width: 100%; height: 100%; background: white; border-radius: 16px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            cursor: pointer; transition: all 0.3s ease; border: 2px dashed #e0e0e0;
            overflow: hidden; position: relative;
        }
        .image-preview:hover { border-color: #6366f1; }
        .image-preview.has-image { border: none; cursor: default; width: auto; height: auto; max-width: 100%; max-height: 100%; }
        .image-preview img {
            display: block; width: auto; height: auto; max-width: 100%; max-height: 100%;
        }
        .add-icon {
            width: 48px; height: 48px; border-radius: 50%;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 8px; box-shadow: 0 4px 16px rgba(99, 102, 241, 0.3);
        }
        .add-icon svg { width: 24px; height: 24px; color: white; }
        .preview-text { font-size: 12px; color: #888; font-weight: 500; }
        .overlay {
            display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 16px; z-index: 10;
            flex-direction: column; align-items: center; justify-content: center;
        }
        .overlay.active { display: flex; }
        .loading-overlay { background: rgba(255,255,255,0.85); }
        .actions-overlay {
            background: transparent;
            align-items: center; justify-content: flex-end;
            padding-bottom: 16px; flex-direction: row; gap: 10px;
        }
        .spinner {
            width: 36px; height: 36px; border: 3px solid #e0e0e0;
            border-top-color: #6366f1; border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-overlay p { font-size: 13px; color: #888; }
        .action-btn {
            width: 40px; height: 40px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            border: none;
        }
        .action-btn:active { transform: scale(0.9); }
        .action-btn.reset { background: #ef4444; }
        .action-btn.reset svg { color: white; width: 18px; height: 18px; }
        .action-btn.download { background: #6366f1; }
        .action-btn.download svg { color: white; width: 18px; height: 18px; }
        .style-section { margin-bottom: 12px; }
        .style-section label { font-size: 13px; font-weight: 500; color: #555; margin-bottom: 6px; display: block; }
        .style-grid {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 8px; max-height: 120px; overflow-y: auto;
            padding: 2px; scrollbar-width: thin;
        }
        .style-item {
            padding: 10px 6px; border: 2px solid #e0e0e0; border-radius: 10px;
            background: white; cursor: pointer; transition: all 0.2s ease;
            text-align: center; font-size: 12px; font-weight: 500;
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            position: relative;
        }
        .style-item:hover { border-color: #c7d2fe; background: #fafafe; }
        .style-item.selected {
            border-color: #6366f1; background: linear-gradient(135deg, #eef2ff 0%, #f5f3ff 100%);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }
        .style-item .style-icon { font-size: 20px; line-height: 1; }
        .style-item .style-name { color: #333; line-height: 1.2; word-break: break-all; }
        .style-item .delete-btn {
            display: none; position: absolute; top: -6px; right: -6px;
            width: 18px; height: 18px; border-radius: 50%;
            background: #ef4444; color: white; border: 2px solid white;
            font-size: 10px; cursor: pointer; align-items: center; justify-content: center;
            line-height: 1; box-shadow: 0 1px 4px rgba(0,0,0,0.2);
        }
        .style-item:hover .delete-btn { display: flex; }
        .style-item.add-style {
            border-style: dashed; border-color: #c7d2fe;
            color: #6366f1; background: #fafafe;
        }
        .style-item.add-style:hover { border-color: #6366f1; background: #eef2ff; }
        .generate-btn {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white; border: none; border-radius: 12px;
            font-size: 15px; font-weight: 600; cursor: pointer;
            transition: all 0.3s ease; box-shadow: 0 4px 16px rgba(99, 102, 241, 0.3);
            margin-bottom: 12px;
        }
        .generate-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(99, 102, 241, 0.4); }
        .generate-btn:active { transform: translateY(0); }
        .generate-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .error-message {
            display: none; background: #fef2f2; border: 1px solid #fecaca;
            border-radius: 10px; padding: 10px 14px; margin-bottom: 12px;
        }
        .error-message.active { display: block; }
        .error-message p { font-size: 12px; color: #dc2626; }
        .hidden { display: none !important; }
        .toast {
            position: fixed; bottom: 30px; left: 50%;
            transform: translateX(-50%); background: #1f2937;
            color: white; padding: 12px 24px; border-radius: 12px;
            font-size: 14px; opacity: 0; transition: opacity 0.3s;
            z-index: 9999; pointer-events: none;
        }
        .toast.show { opacity: 1; }
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4); z-index: 1000;
            align-items: center; justify-content: center;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: white; border-radius: 20px; padding: 24px;
            width: 90%; max-width: 360px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            animation: modalIn 0.25s ease;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal h2 { font-size: 17px; font-weight: 600; color: #1a1a1a; margin-bottom: 16px; }
        .modal label { font-size: 13px; font-weight: 500; color: #555; margin-bottom: 6px; display: block; }
        .modal input {
            width: 100%; padding: 10px 14px; border: 1px solid #e0e0e0;
            border-radius: 10px; font-size: 13px; background: #fafafa;
            transition: all 0.2s ease; margin-bottom: 16px;
        }
        .modal input:focus {
            outline: none; border-color: #6366f1; background: white;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }
        .modal-buttons { display: flex; gap: 10px; justify-content: flex-end; }
        .modal-btn {
            padding: 10px 20px; border-radius: 10px; font-size: 14px;
            font-weight: 500; cursor: pointer; transition: all 0.2s ease;
            border: none;
        }
        .modal-btn.cancel { background: #f3f4f6; color: #555; }
        .modal-btn.cancel:hover { background: #e5e7eb; }
        .modal-btn.save {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white; box-shadow: 0 2px 8px rgba(99,102,241,0.3);
        }
        .modal-btn.save:hover { box-shadow: 0 4px 12px rgba(99,102,241,0.4); }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>AI 修图</h1>
            <div class="version-tag">v2.6.1</div>
            <div class="settings-btn" id="settingsBtn" title="设置">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
            </div>
        </header>

        <div class="preview-wrapper">
            <div class="image-preview" id="imagePreview">
                <div class="add-icon" id="addIcon">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                    </svg>
                </div>
                <div class="preview-text" id="previewText">点击选择图片</div>
            </div>
            <div class="overlay loading-overlay" id="loadingOverlay">
                <div class="spinner"></div>
                <p>生成中...</p>
            </div>
            <div class="overlay actions-overlay" id="actionsOverlay">
                <button class="action-btn download" id="downloadBtn" title="下载">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                </button>
                <button class="action-btn reset" id="resetBtn" title="重置">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                </button>
            </div>
            <input type="file" id="fileInput" accept="image/*" style="display: none">
        </div>

        <div class="style-section">
            <label>风格</label>
            <div class="style-grid" id="styleGrid"></div>
        </div>

        <button class="generate-btn" id="generateBtn">生成</button>

        <div class="error-message" id="errorMessage"><p id="errorText"></p></div>
    </div>

    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <h2>设置</h2>
            <label for="apiKeyInput">API Key</label>
            <input type="password" id="apiKeyInput" placeholder="输入 API Key">
            <div class="modal-buttons">
                <button class="modal-btn cancel" id="settingsCancel">取消</button>
                <button class="modal-btn save" id="settingsSave">保存</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="addStyleModal">
        <div class="modal">
            <h2>添加风格</h2>
            <label for="styleNameInput">风格名称</label>
            <input type="text" id="styleNameInput" placeholder="例如：油画">
            <label for="stylePromptInput">提示词</label>
            <input type="text" id="stylePromptInput" placeholder="例如：转为油画风格">
            <div class="modal-buttons">
                <button class="modal-btn cancel" id="addStyleCancel">取消</button>
                <button class="modal-btn save" id="addStyleSave">添加</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        var selectedImage = null;
        var generatedImageUrl = null;
        var selectedStylePrompt = '';

        var DEFAULT_STYLES = [
            { icon: '🎨', name: '卡通', prompt: '转为卡通动漫风格，色彩鲜艳' },
            { icon: '🖌️', name: '水彩', prompt: '转为水彩画风格，笔触柔和，色彩通透' },
            { icon: '🖼️', name: '油画', prompt: '转为油画风格，笔触厚重，色彩丰富' },
            { icon: '🤖', name: '赛博朋克', prompt: '转为赛博朋克风格，霓虹灯光，未来感' },
            { icon: '🏔️', name: '水墨', prompt: '转为中国水墨画风格，意境悠远' },
            { icon: '🌸', name: '日系', prompt: '转为日系小清新风格，柔和明亮' },
            { icon: '👾', name: '像素', prompt: '转为像素艺术风格' },
            { icon: '✏️', name: '素描', prompt: '转为素描线稿风格，黑白线条' },
            { icon: '🧊', name: '3D', prompt: '转为3D渲染风格，立体感强' },
        ];

        function getStyles() {
            var saved = localStorage.getItem('styles');
            if (saved) return JSON.parse(saved);
            localStorage.setItem('styles', JSON.stringify(DEFAULT_STYLES));
            return DEFAULT_STYLES;
        }

        function saveStyles(styles) {
            localStorage.setItem('styles', JSON.stringify(styles));
        }

        function renderStyles() {
            var grid = document.getElementById('styleGrid');
            var styles = getStyles();
            grid.innerHTML = '';
            styles.forEach(function(s, i) {
                var item = document.createElement('div');
                item.className = 'style-item' + (s.prompt === selectedStylePrompt ? ' selected' : '');
                item.innerHTML =
                    '<span class="style-icon">' + s.icon + '</span>' +
                    '<span class="style-name">' + s.name + '</span>' +
                    '<button class="delete-btn" data-index="' + i + '">&times;</button>';
                item.addEventListener('click', function(e) {
                    if (e.target.classList.contains('delete-btn')) return;
                    document.querySelectorAll('.style-item').forEach(function(el) { el.classList.remove('selected'); });
                    item.classList.add('selected');
                    selectedStylePrompt = s.prompt;
                });
                grid.appendChild(item);
            });
            grid.querySelectorAll('.delete-btn').forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    var idx = parseInt(this.dataset.index);
                    var styles = getStyles();
                    styles.splice(idx, 1);
                    saveStyles(styles);
                    renderStyles();
                    showToast('已删除');
                });
            });
            var addItem = document.createElement('div');
            addItem.className = 'style-item add-style';
            addItem.innerHTML = '<span class="style-icon">+</span><span class="style-name">添加</span>';
            addItem.addEventListener('click', function() {
                document.getElementById('styleNameInput').value = '';
                document.getElementById('stylePromptInput').value = '';
                document.getElementById('addStyleModal').classList.add('active');
            });
            grid.appendChild(addItem);
            if (!selectedStylePrompt && styles.length > 0) {
                selectedStylePrompt = styles[0].prompt;
            }
        }

        function showToast(message) {
            var toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(function() { toast.classList.remove('show'); }, 3000);
        }

        function showError(message) {
            document.getElementById('errorText').textContent = message;
            document.getElementById('errorMessage').classList.add('active');
        }

        function hideError() {
            document.getElementById('errorMessage').classList.remove('active');
        }

        function resetPreview() {
            selectedImage = null;
            generatedImageUrl = null;
            var preview = document.getElementById('imagePreview');
            preview.innerHTML = '';
            preview.classList.remove('has-image');
            var addIcon = document.createElement('div');
            addIcon.className = 'add-icon';
            addIcon.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>';
            var text = document.createElement('div');
            text.className = 'preview-text';
            text.textContent = '点击选择图片';
            preview.appendChild(addIcon);
            preview.appendChild(text);
            document.getElementById('actionsOverlay').classList.remove('active');
        }

        function downloadImage() {
            if (!generatedImageUrl) return;
            var a = document.createElement('a');
            a.href = generatedImageUrl;
            a.download = 'ai-photo-' + Date.now() + '.png';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            showToast('已下载');
        }

        async function generateImage() {
            hideError();
            var apiKey = localStorage.getItem('apiKey') || '';
            if (!apiKey) {
                showToast('请先在设置中配置 API Key');
                document.getElementById('settingsModal').classList.add('active');
                return;
            }
            if (!selectedImage) {
                showToast('请先选择图片');
                return;
            }
            if (!selectedStylePrompt) {
                showToast('请选择风格');
                return;
            }
            document.getElementById('loadingOverlay').classList.add('active');
            document.getElementById('actionsOverlay').classList.remove('active');
            document.getElementById('generateBtn').disabled = true;
            try {
                var response = await fetch('https://wellai.cc/openai/v1/images/generations', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + apiKey
                    },
                    body: JSON.stringify({
                        model: 'Nano-Banana-Pro2',
                        prompt: selectedStylePrompt,
                        response_format: 'b64_json',
                        advance: {
                            reference_images: {
                                normal_reference_images: [
                                    { image: selectedImage }
                                ]
                            }
                        }
                    })
                });
                var data = await response.json();
                document.getElementById('loadingOverlay').classList.remove('active');
                if (data.data && data.data[0] && data.data[0].b64_json) {
                    generatedImageUrl = 'data:image/png;base64,' + data.data[0].b64_json;
                    var preview = document.getElementById('imagePreview');
                    preview.innerHTML = '';
                    var img = document.createElement('img');
                    img.src = generatedImageUrl;
                    img.alt = '生成结果';
                    preview.appendChild(img);
                    preview.classList.add('has-image');
                    document.getElementById('actionsOverlay').classList.add('active');
                    showToast('生成成功');
                } else if (data.error) {
                    showError(data.error.message || 'API 错误');
                } else {
                    showError('生成失败，请重试');
                }
            } catch (error) {
                document.getElementById('loadingOverlay').classList.remove('active');
                showError('请求失败：' + error.message);
            } finally {
                document.getElementById('generateBtn').disabled = false;
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            var savedKey = localStorage.getItem('apiKey');
            if (savedKey) document.getElementById('apiKeyInput').value = savedKey;

            renderStyles();

            document.getElementById('imagePreview').addEventListener('click', function() {
                if (!selectedImage) {
                    document.getElementById('fileInput').click();
                }
            });

            document.getElementById('fileInput').addEventListener('change', function(e) {
                var file = e.target.files[0];
                if (file) {
                    var reader = new FileReader();
                    reader.onload = function(ev) {
                        selectedImage = ev.target.result;
                        generatedImageUrl = null;
                        var preview = document.getElementById('imagePreview');
                        preview.innerHTML = '';
                        var img = document.createElement('img');
                        img.src = selectedImage;
                        img.alt = '预览图片';
                        preview.appendChild(img);
                        preview.classList.add('has-image');
                        document.getElementById('actionsOverlay').classList.remove('active');
                    };
                    reader.readAsDataURL(file);
                }
            });

            document.getElementById('generateBtn').addEventListener('click', function(e) {
                e.preventDefault();
                generateImage();
            });

            document.getElementById('downloadBtn').addEventListener('click', function(e) {
                e.stopPropagation();
                downloadImage();
            });

            document.getElementById('resetBtn').addEventListener('click', function(e) {
                e.stopPropagation();
                resetPreview();
            });

            document.getElementById('settingsBtn').addEventListener('click', function() {
                document.getElementById('apiKeyInput').value = localStorage.getItem('apiKey') || '';
                document.getElementById('settingsModal').classList.add('active');
            });
            document.getElementById('settingsCancel').addEventListener('click', function() {
                document.getElementById('settingsModal').classList.remove('active');
            });
            document.getElementById('settingsSave').addEventListener('click', function() {
                var key = document.getElementById('apiKeyInput').value.trim();
                if (key) {
                    localStorage.setItem('apiKey', key);
                    showToast('API Key 已保存');
                } else {
                    localStorage.removeItem('apiKey');
                }
                document.getElementById('settingsModal').classList.remove('active');
            });
            document.getElementById('settingsModal').addEventListener('click', function(e) {
                if (e.target === this) this.classList.remove('active');
            });

            document.getElementById('addStyleCancel').addEventListener('click', function() {
                document.getElementById('addStyleModal').classList.remove('active');
            });
            document.getElementById('addStyleSave').addEventListener('click', function() {
                var name = document.getElementById('styleNameInput').value.trim();
                var prompt = document.getElementById('stylePromptInput').value.trim();
                if (!name || !prompt) {
                    showToast('请填写风格名称和提示词');
                    return;
                }
                var styles = getStyles();
                styles.push({ icon: '✨', name: name, prompt: prompt });
                saveStyles(styles);
                renderStyles();
                document.getElementById('addStyleModal').classList.remove('active');
                showToast('已添加');
            });
            document.getElementById('addStyleModal').addEventListener('click', function(e) {
                if (e.target === this) this.classList.remove('active');
            });
        });
    </script>
</body>
</html>
