<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 修图</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(180deg, #f8f9fa 0%, #e9ecef 100%);
            min-height: 100vh;
            color: #333;
            overflow-x: hidden;
        }

        .container {
            max-width: 420px;
            margin: 0 auto;
            padding: 24px 20px;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 600;
            color: #1a1a1a;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 14px;
            color: #888;
            margin-top: 8px;
        }

        .api-config {
            margin-bottom: 24px;
        }

        .api-config label {
            display: block;
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .api-config input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            font-size: 14px;
            background: white;
            transition: all 0.2s ease;
        }

        .api-config input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .api-config input::placeholder {
            color: #bbb;
        }

        .image-preview {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: white;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 32px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            border: 2px dashed #e0e0e0;
        }

        .image-preview:hover {
            border-color: #6366f1;
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .image-preview.has-image {
            border: none;
            padding: 0;
        }

        .image-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 18px;
        }

        .add-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.3);
        }

        .add-icon svg {
            width: 32px;
            height: 32px;
            color: white;
        }

        .preview-text {
            font-size: 14px;
            color: #888;
            font-weight: 500;
        }

        .style-section {
            margin-bottom: 32px;
        }

        .style-section h2 {
            font-size: 18px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 16px;
        }

        .style-options {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 8px;
            -webkit-overflow-scrolling: touch;
        }

        .style-options::-webkit-scrollbar {
            display: none;
        }

        .style-option {
            flex-shrink: 0;
            width: 80px;
            height: 80px;
            border-radius: 16px;
            background: white;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border: 2px solid transparent;
        }

        .style-option:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        }

        .style-option.selected {
            border-color: #6366f1;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1) 0%, rgba(139, 92, 246, 0.1) 100%);
        }

        .style-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: linear-gradient(135deg, #e0e7ff 0%, #ede9fe 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .style-icon svg {
            width: 18px;
            height: 18px;
            color: #6366f1;
        }

        .style-name {
            font-size: 11px;
            color: #666;
            font-weight: 500;
        }

        .prompt-section {
            margin-bottom: 24px;
        }

        .prompt-section label {
            display: block;
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .prompt-section textarea {
            width: 100%;
            height: 100px;
            padding: 14px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            font-size: 14px;
            resize: none;
            background: white;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .prompt-section textarea:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .prompt-section textarea::placeholder {
            color: #bbb;
        }

        .generate-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.3);
            margin-bottom: 32px;
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(99, 102, 241, 0.4);
        }

        .generate-btn:active {
            transform: translateY(0);
        }

        .generate-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .result-section {
            margin-top: 24px;
        }

        .result-section h2 {
            font-size: 18px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 16px;
        }

        .result-preview {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: white;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            overflow: hidden;
        }

        .result-preview img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .result-placeholder {
            text-align: center;
            color: #bbb;
        }

        .result-placeholder svg {
            width: 48px;
            height: 48px;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        .result-placeholder p {
            font-size: 14px;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px 0;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid #e0e0e0;
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading p {
            font-size: 14px;
            color: #888;
        }

        .error-message {
            display: none;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 24px;
        }

        .error-message.active {
            display: block;
        }

        .error-message p {
            font-size: 13px;
            color: #dc2626;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>AI 修图</h1>
            <p>上传图片，选择风格，一键生成</p>
        </header>

        <div class="api-config">
            <label for="apiKey">API Key</label>
            <input type="password" id="apiKey" placeholder="输入你的 API Key">
        </div>

        <div class="image-preview" id="imagePreview" onclick="document.getElementById('fileInput').click()">
            <div class="add-icon">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
            </div>
            <span class="preview-text">点击选择图片</span>
        </div>
        <input type="file" id="fileInput" accept="image/*" style="display: none" onchange="handleImageUpload(event)">

        <div class="style-section">
            <h2>风格</h2>
            <div class="style-options">
                <div class="style-option" data-style="cartoon" onclick="selectStyle(this, 'cartoon')">
                    <div class="style-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                    </div>
                    <span class="style-name">卡通</span>
                </div>
                <div class="style-option" data-style="oil-painting" onclick="selectStyle(this, 'oil-painting')">
                    <div class="style-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01" />
                        </svg>
                    </div>
                    <span class="style-name">油画</span>
                </div>
                <div class="style-option" data-style="sketch" onclick="selectStyle(this, 'sketch')">
                    <div class="style-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
                        </svg>
                    </div>
                    <span class="style-name">素描</span>
                </div>
                <div class="style-option" data-style="pixel" onclick="selectStyle(this, 'pixel')">
                    <div class="style-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
                        </svg>
                    </div>
                    <span class="style-name">像素</span>
                </div>
            </div>
        </div>

        <div class="prompt-section">
            <label for="prompt">提示词</label>
            <textarea id="prompt" placeholder="描述你想要的效果..."></textarea>
        </div>

        <button class="generate-btn" id="generateBtn" onclick="generateImage()">生成</button>

        <div class="error-message" id="errorMessage">
            <p id="errorText"></p>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>生成中...</p>
        </div>

        <div class="result-section" id="resultSection">
            <h2>结果</h2>
            <div class="result-preview" id="resultPreview">
                <div class="result-placeholder">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                    <p>等待生成...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let selectedStyle = '';
        let uploadedImage = null;

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedImage = e.target.result;
                    const preview = document.getElementById('imagePreview');
                    preview.innerHTML = '<img src="' + uploadedImage + '" alt="Uploaded image">';
                    preview.classList.add('has-image');
                };
                reader.readAsDataURL(file);
            }
        }

        function selectStyle(element, style) {
            document.querySelectorAll('.style-option').forEach(el => {
                el.classList.remove('selected');
            });
            element.classList.add('selected');
            selectedStyle = style;
        }

        async function generateImage() {
            const apiKey = document.getElementById('apiKey').value;
            const prompt = document.getElementById('prompt').value;
            
            if (!apiKey) {
                showError('请输入 API Key');
                return;
            }

            if (!uploadedImage) {
                showError('请先上传图片');
                return;
            }

            if (!selectedStyle) {
                showError('请选择一种风格');
                return;
            }

            if (!prompt) {
                showError('请输入提示词');
                return;
            }

            hideError();
            showLoading();
            hideResult();

            try {
                const base64Data = uploadedImage.split(',')[1];
                
                const stylePrompts = {
                    'cartoon': 'Convert this image to cartoon style',
                    'oil-painting': 'Convert this image to oil painting style',
                    'sketch': 'Convert this image to pencil sketch style',
                    'pixel': 'Convert this image to pixel art style'
                };

                const fullPrompt = prompt + ' ' + (stylePrompts[selectedStyle] || '');

                const response = await fetch('https://wellai.cc/openai/v1/images/generations', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + apiKey,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'Nano-Banana-Pro2',
                        prompt: fullPrompt,
                        response_format: 'b64_json',
                        advance: {
                            reference_images: {
                                normal_reference_images: [
                                    {
                                        image: 'data:image/jpeg;base64,' + base64Data
                                    }
                                ]
                            }
                        }
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error?.message || '生成失败');
                }

                const data = await response.json();
                const imageData = data.data[0].b64_json;
                const imageUrl = 'data:image/png;base64,' + imageData;

                showResult(imageUrl);

            } catch (error) {
                showError(error.message || '生成失败，请稍后重试');
            } finally {
                hideLoading();
            }
        }

        function showError(message) {
            const errorElement = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            errorText.textContent = message;
            errorElement.classList.add('active');
        }

        function hideError() {
            document.getElementById('errorMessage').classList.remove('active');
        }

        function showLoading() {
            document.getElementById('loading').classList.add('active');
        }

        function hideLoading() {
            document.getElementById('loading').classList.remove('active');
        }

        function hideResult() {
            document.getElementById('resultSection').classList.add('hidden');
        }

        function showResult(imageUrl) {
            const resultSection = document.getElementById('resultSection');
            const resultPreview = document.getElementById('resultPreview');
            resultPreview.innerHTML = '<img src="' + imageUrl + '" alt="Generated image">';
            resultSection.classList.remove('hidden');
        }
    </script>
</body>
</html>
